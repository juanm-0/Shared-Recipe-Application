<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Conflict</title>
</head>
<body>
    <h1>This record was changed by someone else</h1>
    <p>
        {{ target }} was modified by someone else since you loaded it at
        {{ request_path }}. Please go back and reload the current version
        before trying again.
    </p>
    {% if saved %}
    <p>Current saved value: {{ saved }}</p>
    {% endif %}
</body>
</html>
